{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger shadow-sm">
            <div class="card-body">
                <h1 class="h4 text-danger">Eliminar categoría</h1>
                <p>¿Seguro que quieres eliminar <strong>{{ categoria.nombre }}</strong>?</p>
                <p class="text-danger">Atención: también se eliminarán sus productos.</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Eliminar</button>
                    <a href="{% url 'categoria_lista' %}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
