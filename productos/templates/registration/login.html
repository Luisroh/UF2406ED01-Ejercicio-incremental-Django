{% extends "base.html" %}
{% block title %}
Login
{% endblock %}
{% block content %}
<h1>
    Iniciar sesión
</h1>
{% if form.errors %}

<p>
    Usuario o contraseña incorrectos.
</p>
{% endif %}
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">
        Entrar
    </button>
</form>
<p>
    <a href="{% url 'password_reset' %}">
        ¿Has olvidado tu contraseña?
    </a>
</p>
<p>
    ¿No tienes cuenta?
    <a href="{% url 'register' %}">
        Registrarse
    </a>
</p>
{% endblock %}
