{% extends "base.html" %}
{% block content %}
<h1>
    Nueva contraseña
</h1>
{% if validlink %}
<p>
    Introduce tu nueva contraseña dos veces.
</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">
        Cambiar contraseña
    </button>
</form>
{% else %}
<p>
    El enlace de recuperación no es válido o ha caducado.
</p>
<a href="{% url 'password_reset' %}">
    Solicitar otro enlace
</a>
{% endif %}
{% endblock %}
