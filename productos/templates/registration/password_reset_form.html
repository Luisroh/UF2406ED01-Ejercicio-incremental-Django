{% extends "base.html" %}
{% block content %}
<h1>
    Recuperar contraseña
</h1>
<p>
    Introduce el correo electrónico asociado a tu cuenta.
</p>
<form method="post">
    {% csrf_token %}

    {{ form.as_p }}
    <button type="submit">
        Recuperar contraseña
    </button>
</form>
{% endblock %}
