<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>
        {% block title %}
        Tienda Django
        {% endblock %}
    </title>
</head>

<body>
    <nav>
        <a href="{% url 'home' %}">
            Inicio
        </a>
        |
        <a href="{% url 'producto_lista' %}">
            Productos
        </a>
        {% if user.is_authenticated %}
        |
        <a href="{% url 'categoria_lista' %}">
            Categorías
        </a>
        |
        Usuario:
        {{ user.username }}
        |
        <form method="post" action="{% url 'logout' %}" style="display:inline;">

            {% csrf_token %}
            <button type="submit">
                Logout
            </button>
        </form>
        {% else %}
        |
        <a href="{% url 'login' %}">
            Login
        </a>
        |
        <a href="{% url 'register' %}">
            Registrarse
        </a>
        {% endif %}
    </nav>
    <hr>
    {% block content %}
    {% endblock %}
</body>

</html>
